# Runs the Coastal Watch tests on every pull request and every change to main.
# The tests use saved feed responses, so they never touch the live feeds.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Wave collection script
        run: python3 -m unittest discover -s tests -p "test_*.py" -v
